                list.appendChild(div);
            });
        }

        // Master render for the whole data panel (v3 mode)
        function renderDataPanel() {
            renderGrid();
            renderTransfers();
        }

        // ---- V3 CRUD ----
        function addSeriesColumn() {
            if (!seriesColumns) return;
            const nextId = seriesColumns.length ? Math.max(...seriesColumns.map(c => c.id)) + 1 : 0;
            seriesColumns.push({ id: nextId, label: '' });
            renderDataPanel(); saveToLocalStorage(); generateDiagram();
        }
        function removeSeriesColumn(ci) {
            const colId = seriesColumns[ci].id;
            seriesColumns.splice(ci, 1);
            (seriesModel || []).forEach(s => delete s.values[colId]);
            seriesFlows = (seriesFlows || []).filter(f => f.fromCol !== colId && f.toCol !== colId);
            renderDataPanel(); saveToLocalStorage(); generateDiagram();
        }
        function updateSeriesColumn(ci, field, val) {
            seriesColumns[ci][field] = val;
            renderTransfers();
            renderColumnLabelInputs(seriesColumns.length);
            saveToLocalStorage(); generateDiagram();
        }
        function addSeries() {
            if (!seriesModel) return;
            const themeOrder = [2, 3, 4, 5, 6, 7, 0, 1];
            const ti = themeOrder[seriesModel.length % themeOrder.length];
            seriesModel.push({ name: `Series ${seriesModel.length + 1}`, color: { themeIndex: ti, variant: 'base' }, values: {} });
            renderGrid(); saveToLocalStorage(); generateDiagram();
            // Focus the new name input
            const rows = document.querySelectorAll('#grid-body tr');
            const lastRow = rows[rows.length - 1];
            if (lastRow) { const inp = lastRow.querySelector('.grid-series-name'); if (inp) { inp.focus(); inp.select(); } }
        }
        function updateSeriesName(si, newName) {
            const trimmed = newName.trim();
            if (!trimmed || trimmed === seriesModel[si].name) return;
            const old = seriesModel[si].name;
            seriesModel[si].name = trimmed;
            (seriesFlows || []).forEach(f => {
                if (f.from === old) f.from = trimmed;
                if (f.to === old) f.to = trimmed;
            });
            renderTransfers(); saveToLocalStorage(); generateDiagram();
        }
        function updateSeriesValue(si, colId, rawVal) {
            const trimmed = String(rawVal).trim();
            const v = parseFloat(trimmed);
            if (trimmed === '' || isNaN(v) || v < 0) delete seriesModel[si].values[colId];
            else seriesModel[si].values[colId] = v;
            saveToLocalStorage(); generateDiagram();
        }
        function deleteSeries(si) {
            const name = seriesModel[si].name;
            seriesModel.splice(si, 1);
            seriesFlows = (seriesFlows || []).filter(f => f.from !== name && f.to !== name);
            renderDataPanel(); saveToLocalStorage(); generateDiagram();
        }
        function openSeriesColorPickerGrid(triggerEl, si) {
            openColorPicker(triggerEl, seriesModel[si].color, ref => {
                seriesModel[si].color = ref;
                triggerEl.style.background = resolveThemeColor(ref);
                saveToLocalStorage(); generateDiagram();
            });
        }
        function addTransfer() {
            if (!seriesModel || seriesModel.length < 1) return;
            if (!seriesColumns || seriesColumns.length < 2) return;
            const colIds = seriesColumns.map(c => c.id).sort((a, b) => a - b);
            seriesFlows.push({ from: seriesModel[0].name, fromCol: colIds[0], to: seriesModel[0].name, toCol: colIds[1], value: 0 });
            renderTransfers(); saveToLocalStorage(); generateDiagram();
        }
        function updateTransfer(ti, field, val) {
            seriesFlows[ti][field] = val;
            saveToLocalStorage(); generateDiagram();
        }
        function deleteTransfer(ti) {
            seriesFlows.splice(ti, 1);
            renderTransfers(); saveToLocalStorage(); generateDiagram();
        }

        // ============================================================
        // SMART TABLE — the primary input UI
        // Nodes are created implicitly: every unique name typed in a
        // Source or Target cell becomes a node with an auto-assigned
        // color. Clicking the color dot opens the existing color picker.
        // ============================================================

        // Node registry: maps name → {color}. This is the single source
        // of truth for node colors. links[] stays as-is (source/target names).
        // On every table change: sync nodes[] from the registry, then render.
        let nodeRegistry = {}; // { "Aviva": { color: {themeIndex, variant} } }
        let nodeLabels   = {}; // { "Aviva": "custom label" } — "" means suppress; undefined means use name

        const THEME_ORDER = [2, 3, 4, 5, 6, 7, 0, 1];
        function nextAutoColor() {
            const used = Object.keys(nodeRegistry).length;
            const ti = THEME_ORDER[used % THEME_ORDER.length];
            return { themeIndex: ti, variant: 'base' };
        }

        function resetToAutoColors() {
            manualColorOverrides = {};
            autoAssignColors();
            syncNodesFromRegistry();
            renderSmartTable();
            saveToLocalStorage();
            generateDiagram();
        }

        function ensureNode(name) {
            if (!name || !name.trim()) return;
            const key = name.trim();
            if (!nodeRegistry[key]) {
                // Placeholder until the next full autoAssignColors() pass gives it its
                // real position-based color; keeps ensureNode() cheap and side-effect-free
                // per call rather than re-running the whole topology scan on every keystroke.
                nodeRegistry[key] = { color: { themeIndex: 0, variant: 'base' } };
            }
        }

        // ---- Automatic color allocation by topology + vertical order ----
        // Edge nodes (the first and last column — i.e. sources with no inbound link, and
        // sinks with no outbound link) all share theme color column 1 (themeIndex 0),
        // base variant. Every internal node gets a color from a 42-slot sequence built from
        // the remaining 7 theme colors × 6 variants (base, 80%/60%/40% lighter, 25%/50%
        // darker), walked in the same order nodes are drawn: column by column left to
        // right, and within each column top to bottom (i.e. by descending flow value,
        // matching the render layout's own sort). This only OVERWRITES colors that the
        // user hasn't manually customized (tracked via manualColorOverrides) so a person's
        // hand-picked colors survive re-running this after adding/removing rows.
        let manualColorOverrides = {}; // { nodeName: true } once a user explicitly sets a color

        function autoAssignColors() {
            const allNames = Array.from(new Set(links.flatMap(l => [l.source, l.target]).filter(Boolean)));
            if (!allNames.length) return;

            const rank = assignColumnsRaw(allNames, links);
            const maxRank = Math.max(...Object.values(rank));

            // Per-node value for vertical sort: total inflow, or total outflow if it's a
            // pure source (matches the render layout's own nodeValue() logic).
            function rawValue(name) {
                const inflow = links.filter(l => l.target === name).reduce((s, l) => s + (l.value || 0), 0);
                if (inflow > 0) return inflow;
                return links.filter(l => l.source === name).reduce((s, l) => s + (l.value || 0), 0);
            }

            // Bucket names by column rank
            const byCol = Array.from({ length: maxRank + 1 }, () => []);
            allNames.forEach(n => byCol[rank[n]].push(n));
            byCol.forEach(col => col.sort((a, b) => rawValue(b) - rawValue(a)));

            // 42-slot internal-color sequence: theme indices 1-7, each through 6 variants.
            const variantCycle = ['base', 'tint4', 'tint3', 'tint2', 'shade0', 'shade1'];
            const internalSequence = [];
            variantCycle.forEach(variant => {
                for (let ti = 1; ti < themePalette.length; ti++) {
                    internalSequence.push({ themeIndex: ti, variant });
                }
            });
            // Order: cycle through theme colors first (1..7) within a variant, then move to
            // the next variant — matches "cycling through theme colours then each tint/shade".
            let seqIndex = 0;

            byCol.forEach((col, c) => {
                const isEdge = c === 0 || c === maxRank;
                col.forEach(name => {
                    if (manualColorOverrides[name]) return; // user already picked this one
                    ensureNode(name);
                    if (isEdge) {
                        nodeRegistry[name].color = { themeIndex: 0, variant: 'base' };
                    } else {
                        nodeRegistry[name].color = internalSequence[seqIndex % internalSequence.length];
                        seqIndex++;
                    }
                });
            });
        }

        // Rebuild nodes[] from nodeRegistry + current link names
        function syncNodesFromRegistry() {
            const usedNames = new Set();
            links.forEach(l => { if (l.source) usedNames.add(l.source); if (l.target) usedNames.add(l.target); });
            nodes = [];
            usedNames.forEach(name => {
                ensureNode(name);
                const n = { name, color: nodeRegistry[name].color };
                if (nodeLabels[name] !== undefined) n.label = nodeLabels[name]; // "" = suppress
                nodes.push(n);
            });
        }

        // ---- Smart table render ----
        function renderSmartTable() {
            const tbody = document.getElementById('smart-table-body');
            if (!tbody) return;
            tbody.innerHTML = '';

            // Render each existing link row
            links.forEach((link, i) => {
                tbody.appendChild(buildSmartRow(i, link.source, link.target, link.value));
            });

            // Always append one blank sentinel row at the bottom
            tbody.appendChild(buildSmartRow(-1, '', '', ''));
        }

        function buildSmartRow(rowIndex, sourceName, targetName, value) {
            const tr = document.createElement('tr');
            tr.dataset.rowIndex = rowIndex;
            if (rowIndex >= 0) {
                tr.addEventListener('mouseenter', () => highlightRibbon(rowIndex, true));
                tr.addEventListener('mouseleave', () => highlightRibbon(rowIndex, false));
            }

            const sourceColor = sourceName && nodeRegistry[sourceName] ? resolveThemeColor(nodeRegistry[sourceName].color) : null;
            const targetColor = targetName && nodeRegistry[targetName] ? resolveThemeColor(nodeRegistry[targetName].color) : null;

            tr.innerHTML = `
                <td>
                    <div class="node-cell">
                        <span class="node-dot ${sourceColor ? '' : 'unset'}"
                              style="${sourceColor ? `background:${sourceColor}` : ''}"
                              data-node="${escapeAttr(sourceName)}"
                              onclick="openNodeColorDot(this)"></span>
                        <input class="node-input" type="text" value="${escapeAttr(sourceName)}"
                               placeholder="Source"
                               data-field="source" data-row="${rowIndex}"
                               autocomplete="off"
                               oninput="onNodeInput(this)"
                               onblur="onNodeBlur(this)"
                               onkeydown="onNodeKey(event, this)">
                    </div>
                </td>
                <td class="td-arrow">→</td>
                <td>
                    <div class="node-cell">
                        <span class="node-dot ${targetColor ? '' : 'unset'}"
                              style="${targetColor ? `background:${targetColor}` : ''}"
                              data-node="${escapeAttr(targetName)}"
                              onclick="openNodeColorDot(this)"></span>
                        <input class="node-input" type="text" value="${escapeAttr(targetName)}"
                               placeholder="Target"
                               data-field="target" data-row="${rowIndex}"
                               autocomplete="off"
                               oninput="onNodeInput(this)"
                               onblur="onNodeBlur(this)"
                               onkeydown="onNodeKey(event, this)">
                    </div>
                </td>
                <td class="td-value">
                    <input class="value-input" type="number" value="${value !== '' ? value : ''}"
                           placeholder="0" min="0" step="any"
                           data-row="${rowIndex}"
                           onchange="onValueChange(this)"
                           onblur="onValueChange(this)"
                           onfocus="onSentinelFocus(this)">
                </td>
                <td class="td-del">
                    ${rowIndex >= 0 ? `<button class="row-del-btn" onclick="deleteSmartRow(${rowIndex})" title="Delete row">
                        <i class="fa-solid fa-xmark"></i>
                    </button>` : ''}
                </td>
            `;
            return tr;
        }

        // ---- Autocomplete ----
        let acActiveInput = null;
        let acActiveIndex = -1;

        function onNodeInput(input) {
            const val = input.value;
            const rowIndex = parseInt(input.dataset.row, 10);

            // If this is the sentinel row and user starts typing, materialise it
            if (rowIndex < 0 && val.trim()) {
                materializeSentinel(input);
                return;
            }

            showAutocomplete(input, val);
        }

        function showAutocomplete(input, query) {
            const ac = document.getElementById('node-autocomplete');
            const allNames = Object.keys(nodeRegistry).filter(n => n !== input.value);
            const matches = query.trim()
                ? allNames.filter(n => n.toLowerCase().includes(query.toLowerCase()))
                : allNames;

            if (matches.length === 0) { ac.style.display = 'none'; return; }

            const rect = input.getBoundingClientRect();
            ac.style.display = 'block';
            ac.style.left = rect.left + 'px';
            ac.style.top = (rect.bottom + 4) + 'px';
            ac.style.width = Math.max(rect.width, 160) + 'px';
            acActiveInput = input;
            acActiveIndex = -1;

            ac.innerHTML = matches.map((name, i) => {
                const color = nodeRegistry[name] ? resolveThemeColor(nodeRegistry[name].color) : '#e7e3d8';
                return `<div class="autocomplete-item" data-name="${escapeAttr(name)}" onclick="selectAutocomplete('${escapeAttr(name)}')">
                    <span class="autocomplete-dot" style="background:${color}"></span>
                    ${escapeHtml(name)}
                </div>`;
            }).join('');
        }

        function selectAutocomplete(name) {
            if (!acActiveInput) return;
            acActiveInput.value = name;
            hideAutocomplete();
            onNodeBlur(acActiveInput);
        }

        function hideAutocomplete() {
            document.getElementById('node-autocomplete').style.display = 'none';
            acActiveInput = null;
            acActiveIndex = -1;
        }

        function onNodeKey(e, input) {
            const ac = document.getElementById('node-autocomplete');
            if (ac.style.display === 'none') return;
            const items = ac.querySelectorAll('.autocomplete-item');
            if (e.key === 'ArrowDown') {
                e.preventDefault();
                acActiveIndex = Math.min(acActiveIndex + 1, items.length - 1);
                items.forEach((it, i) => it.classList.toggle('is-active', i === acActiveIndex));
            } else if (e.key === 'ArrowUp') {
                e.preventDefault();
                acActiveIndex = Math.max(acActiveIndex - 1, 0);
                items.forEach((it, i) => it.classList.toggle('is-active', i === acActiveIndex));
            } else if (e.key === 'Enter' || e.key === 'Tab') {
                if (acActiveIndex >= 0 && items[acActiveIndex]) {
                    e.preventDefault();
                    selectAutocomplete(items[acActiveIndex].dataset.name);
                } else {
                    hideAutocomplete();
                }
            } else if (e.key === 'Escape') {
                hideAutocomplete();
            }
        }

        document.addEventListener('click', (e) => {
            if (!e.target.closest('#node-autocomplete') && !e.target.closest('.node-input')) {
                hideAutocomplete();
            }
        }, true);

        // ---- Row materialise / blur / delete ----
        function materializeSentinel(inputInSentinel) {
            // Add a new blank link and re-render; focus will be restored by the caller
            const row = inputInSentinel.closest('tr');
            const field = inputInSentinel.dataset.field;
            const val = inputInSentinel.value.trim();
            links.push({ source: field === 'source' ? val : '', target: field === 'target' ? val : '', value: 0 });
            ensureNode(val);
            syncNodesFromRegistry();
            renderSmartTable();
            saveToLocalStorage();
            generateDiagram();
            // Re-focus the correct input in the new row
            const newRow = document.querySelector(`#smart-table-body tr[data-row-index="${links.length - 1}"]`);
            if (newRow) {
                const inp = newRow.querySelector(`input[data-field="${field}"]`);
                if (inp) { inp.focus(); inp.setSelectionRange(inp.value.length, inp.value.length); }
            }
        }

        function onNodeBlur(input) {
            setTimeout(() => {
                // Delay so autocomplete click can fire first
                if (document.activeElement && document.activeElement.closest('#node-autocomplete')) return;
                hideAutocomplete();
                commitNodeInput(input);
            }, 120);
        }

        function commitNodeInput(input) {
            const rowIndex = parseInt(input.dataset.row, 10);
            const field = input.dataset.field;
            const name = input.value.trim();
            if (rowIndex < 0) return; // sentinel
            if (!name) {
                // Empty source or target: leave as-is, don't commit
                return;
            }
            ensureNode(name);
            links[rowIndex][field] = name;
            syncNodesFromRegistry();
            autoAssignColors();
            renderSmartTable();
            saveToLocalStorage();
            generateDiagram();
        }

        function onValueChange(input) {
            const rowIndex = parseInt(input.dataset.row, 10);
            if (rowIndex < 0) return;
            const v = parseFloat(input.value);
            links[rowIndex].value = isNaN(v) ? 0 : v;
            autoAssignColors();
            saveToLocalStorage();
            generateDiagram();
        }

        function onSentinelFocus(input) {
            // If the value field of the sentinel gets focus, materialise it if source+target are set
            // For now just leave blank — user will tab/type through source/target first
        }

        function deleteSmartRow(rowIndex) {
            links.splice(rowIndex, 1);
            syncNodesFromRegistry();
            autoAssignColors();
            renderSmartTable();
            saveToLocalStorage();
            generateDiagram();
        }

        // ---- Node color from dot ----
        function openNodeColorDot(dotEl) {
            const name = dotEl.dataset.node;
            if (!name) return;
            openNodeProps(name, dotEl);
        }

        // ---- Node color/label from clicking the node directly in the diagram ----
        function openNodeColorFromPlot(nodeEl) {
            const name = nodeEl.dataset.name;
            if (!name) return;
            openNodeProps(name, nodeEl);
        }

        // Shared implementation: builds and shows the label+color props popover anchored
        // to whatever element triggered it (smart-table dot, or a node bar/label in the
        // actual SVG plot). Anchoring to the real click target — rather than e.g. always
        // anchoring to a fixed corner — is what lets positionPopover() place it right next
        // to whichever node was clicked, in-context, without scrolling.
        function openNodeProps(name, anchorEl) {
            ensureNode(name);

            // Close any existing node-props popover first
            const existing = document.getElementById('node-props-popover');
            if (existing) existing.remove();

            const popover = document.createElement('div');
            popover.id = 'node-props-popover';
            popover.className = 'color-popover';
            popover.style.cssText = 'min-width:210px; padding:12px 14px;';

            const currentLabel = nodeLabels[name];
            const labelPlaceholder = name; // placeholder shows the default (the node name itself)

            popover.innerHTML = `
                <div style="font-size:11px; font-weight:700; color:#9a9484; text-transform:uppercase; letter-spacing:0.05em; margin-bottom:10px;">${escapeHtml(name)}</div>
                <div style="margin-bottom:10px;">
                    <label style="font-size:10px; font-weight:700; color:#9a9484; text-transform:uppercase; letter-spacing:0.04em; display:block; margin-bottom:4px;">
                        Label <span style="font-weight:500; text-transform:none; letter-spacing:0; color:#b3ad9c;">— leave blank to hide</span>
                    </label>
                    <input id="node-label-input" type="text" maxlength="40"
                           value="${escapeAttr(currentLabel !== undefined ? currentLabel : '')}"
                           placeholder="${escapeAttr(labelPlaceholder)}"
                           style="width:100%; border:1px solid #e7e3d8; border-radius:7px; padding:5px 8px; font-size:12px; font-weight:500; color:#1c2127; box-sizing:border-box;"
                           oninput="previewNodeLabel('${escapeAttr(name)}', this.value)">
                    <div style="font-size:10px; color:#b3ad9c; margin-top:3px;">Default shows the node name. Type to override; clear to restore default.</div>
                </div>
                <button onclick="openColorPickerFromProps(this, '${escapeAttr(name)}')"
                        style="display:flex; align-items:center; gap:6px; width:100%; background:#f4f2ed; border:none; border-radius:8px; padding:7px 10px; cursor:pointer; font-size:12px; font-weight:600; color:#1c2127;">
                    <span style="width:14px; height:14px; border-radius:50%; background:${resolveThemeColor(nodeRegistry[name].color)}; border:1.5px solid rgba(0,0,0,0.12); flex-shrink:0;"></span>
                    Change color
                </button>
            `;

            document.body.appendChild(popover);
            positionPopover(popover, anchorEl);

            // Focus label input
            setTimeout(() => { const inp = popover.querySelector('#node-label-input'); if (inp) inp.focus(); }, 50);

            // Close on outside click
            setTimeout(() => {
                document.addEventListener('mousedown', function handler(e) {
                    if (!popover.contains(e.target) && e.target !== anchorEl) {
                        // Commit label on close
                        const inp = popover.querySelector('#node-label-input');
                        if (inp) commitNodeLabel(name, inp.value);
                        popover.remove();
                        document.removeEventListener('mousedown', handler);
                    }
                });
            }, 0);
        }

        function previewNodeLabel(name, val) {
            // Live preview as user types
            if (val === '') delete nodeLabels[name];
            else nodeLabels[name] = val;
            syncNodesFromRegistry();
            generateDiagram();
        }

        function commitNodeLabel(name, val) {
            if (val.trim() === '') {
                delete nodeLabels[name];
            } else {
                nodeLabels[name] = val.trim();
            }
            syncNodesFromRegistry();
            renderSmartTable();
            saveToLocalStorage();
            generateDiagram();
        }

        function openColorPickerFromProps(btn, name) {
            // Close the props popover, then open the color picker
            const propsPop = document.getElementById('node-props-popover');
            if (propsPop) propsPop.remove();
            ensureNode(name);
            openColorPicker(btn, nodeRegistry[name].color, (newRef) => {
                nodeRegistry[name].color = newRef;
                manualColorOverrides[name] = true; // protect from future autoAssignColors() passes
                syncNodesFromRegistry();
                renderSmartTable();
                saveToLocalStorage();
                generateDiagram();
            });
        }

        // ---- Row ↔ ribbon hover highlight ----
        function highlightRibbon(rowIndex, on) {
            const svg = document.getElementById('sankey-svg');
            if (!svg) return;
            const ribbons = svg.querySelectorAll(`[data-link-index="${rowIndex}"]`);
            ribbons.forEach(r => r.classList.toggle('is-highlighted', on));
            // Also highlight the row
            const row = document.querySelector(`#smart-table-body tr[data-row-index="${rowIndex}"]`);
            if (row) row.classList.toggle('row-highlighted', on);
        }

        // ---- Compat shims (called elsewhere) ----
        function renderNodes() {
            if (isV3Mode()) return;
            renderSmartTable();
        }
        function renderFlowsTable() {
            if (isV3Mode()) { renderDataPanel(); return; }
            renderSmartTable();
        }
        function updateFlowSelects() { renderSmartTable(); }
        function addFlowRow() {
            links.push({ source: '', target: '', value: 0 });
            renderSmartTable();
        }
        function updateLink(index, field, value) {
            links[index][field] = value;
            saveToLocalStorage(); generateDiagram();
        }
        function deleteLink(index) {
            links.splice(index, 1);
            syncNodesFromRegistry(); renderSmartTable(); saveToLocalStorage(); generateDiagram();
        }


        // Measures text width using an offscreen canvas so we can size layout margins
        // BEFORE layout runs, instead of discovering labels don't fit after the fact.
        // ============================================================
        // Hand-authored Sankey rendering engine.
        // No charting library: every node, ribbon, and label is computed
        // and drawn directly as SVG, following the same approach as a
        // hand-built editorial chart — manual bezier ribbons, two-pass
        // proportional node sizing, and labels placed in dedicated
        // margin space rather than fighting the flow paths for room.
        // ============================================================

        let measureCtx = null;
        function measureTextWidth(text, font) {
            if (!measureCtx) measureCtx = document.createElement('canvas').getContext('2d');
            measureCtx.font = font;
            return measureCtx.measureText(text).width;
        }

        function formatFlowValue(v) { return SankeyRender.formatFlowValue(v); }

        // The rendering engine itself (layout, ribbons, nodes, labels) lives in
        // sankey-render.js so the Node CLI (scripts/render-sankey.mjs) draws with exactly the
        // same code. This wrapper feeds it the page state, then does the page-only work.
        function generateDiagram() {
            if (isV3Mode()) compileSeriesModel();
            const container = document.getElementById('sankey-chart');

            if (!nodes.length || !links.length) {
                container.innerHTML = `
                    <div class="flex flex-col items-center justify-center h-full text-slate-400 py-16 px-4 text-center">
                        <i class="fa-solid fa-cubes-stacked text-3xl mb-2 text-slate-200"></i>
                        <p class="text-xs font-medium">Awaiting Data Mappings</p>
                    </div>`;
                return;
            }

            const result = SankeyRender.renderDiagramBody({
                nodes, links, columnLabels, paletteMode, ribbonStyle, diagramAspect,
                showValues, showPassThrough, globalOpacityValue, themePalette
            }, {
                measureTextWidth: (text, font) => measureTextWidth(text, font),
                containerW: container.getBoundingClientRect().width,
                locale: undefined
            });

            if (result.status !== 'ok') {
                container.innerHTML = `
                    <div class="flex flex-col items-center justify-center h-full text-slate-400 py-16 px-4 text-center">
                        <i class="fa-solid fa-cubes-stacked text-3xl mb-2 text-slate-200"></i>
                        <p class="text-xs font-medium">No valid flows to render</p>
                    </div>`;
                return;
            }
            const { W, H, body: svg, ribbons, validLinks, numCols } = result;
            activeGradientsCache = ribbons;

            container.innerHTML = `<svg id="sankey-svg" viewBox="0 0 ${W} ${H}" style="width:100%; height:auto; display:block;" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="sankey-a11y-summary">${svg}</svg>`;
            chartDiv = container.querySelector('#sankey-svg');

            renderColumnLabelInputs(numCols);
            attachLinkHighlighting();
            renderAccessibleSummary(validLinks);
        }

        function escapeHtml(s) { return SankeyRender.escapeHtml(s); }
        function escapeAttr(s) { return SankeyRender.escapeAttr(s); }

        // Hovering a node, label, or ribbon highlights only what's connected to it.
        function attachLinkHighlighting() {
            const svgEl = chartDiv;
            if (!svgEl) return;
            const ribbonEls = svgEl.querySelectorAll('.sk-ribbon');
            const nodeEls = svgEl.querySelectorAll('.sk-node');
            const labelEls = svgEl.querySelectorAll('.sk-label');

            function setHighlight(name) {
                if (name === null) {
                    ribbonEls.forEach(r => r.classList.remove('is-dimmed'));
                    nodeEls.forEach(n => n.classList.remove('is-dimmed'));
                    labelEls.forEach(l => l.classList.remove('is-dimmed'));
                    return;
                }
                const connected = new Set([name]);
                activeGradientsCache.forEach(r => {
                    if (r.source === name) connected.add(r.target);
                    if (r.target === name) connected.add(r.source);
                });
                ribbonEls.forEach(r => {
                    const isConnected = r.dataset.source === name || r.dataset.target === name;
                    r.classList.toggle('is-dimmed', !isConnected);
                });
                nodeEls.forEach(n => n.classList.toggle('is-dimmed', !connected.has(n.dataset.name)));
                labelEls.forEach(l => l.classList.toggle('is-dimmed', !connected.has(l.dataset.name)));
            }

            nodeEls.forEach(n => {
                n.addEventListener('mouseenter', () => setHighlight(n.dataset.name));
                n.addEventListener('mouseleave', () => setHighlight(null));
                n.addEventListener('click', (e) => {
                    e.stopPropagation();
                    openNodeColorFromPlot(n);
                });
            });
            labelEls.forEach(l => {
                l.addEventListener('mouseenter', () => setHighlight(l.dataset.name));
                l.addEventListener('mouseleave', () => setHighlight(null));
                l.addEventListener('click', (e) => {
                    e.stopPropagation();
                    openNodeColorFromPlot(l);
                });
            });
            ribbonEls.forEach(r => {
                r.addEventListener('mouseenter', () => {
                    const isSameFlow = (other) => other.dataset.source === r.dataset.source && other.dataset.target === r.dataset.target;
                    ribbonEls.forEach(other => other.classList.toggle('is-dimmed', !isSameFlow(other)));
                    nodeEls.forEach(n => n.classList.toggle('is-dimmed', n.dataset.name !== r.dataset.source && n.dataset.name !== r.dataset.target));
                    labelEls.forEach(l => l.classList.toggle('is-dimmed', l.dataset.name !== r.dataset.source && l.dataset.name !== r.dataset.target));
                });
                r.addEventListener('mouseleave', () => setHighlight(null));
            });
        }

        function renderAccessibleSummary(validLinks) {
            const svgEl = chartDiv;
            if (!svgEl) return;
            const existing = svgEl.querySelector('#sankey-a11y-summary');
            if (existing) existing.remove();
            const desc = document.createElementNS('http://www.w3.org/2000/svg', 'desc');
            desc.id = 'sankey-a11y-summary';
            desc.textContent = SankeyRender.accessibleSummaryText(validLinks);
            svgEl.insertBefore(desc, svgEl.firstChild);
        }

        // The _instructions block is purely documentation: the importer explicitly ignores
        // any key it doesn't recognise, so this travels with every exported file without
        // affecting how it loads back in. The goal is that a person — or an AI assistant
        // populating this file on someone's behalf — can read this one block and know
        // exactly what's valid, with no other reference needed.
        function buildExportInstructions() {
            return {
                "READ_ME_FIRST": "This file is data for a Sankey diagram generator. The 'nodes' and 'links' arrays below are what actually render — everything in this _instructions block is documentation only and is ignored on import. Edit nodes/links/columnLabels directly; this block is safe to delete.",
                "overview": "A Sankey diagram is nodes (vertical bars) connected by links (flows). Links point left-to-right: every link's source must be in an earlier or equal column to its target, never later. The diagram automatically figures out which column each node belongs to from the link structure — you never set columns directly except via the optional 'column' override field.",
                "schema": {
                    "version": "Must be the literal number 2. Required.",
                    "nodes": "Array of node objects (see 'node_fields' below). Required. Every name referenced by any link's source/target must have an entry here.",
                    "links": "Array of link objects (see 'link_fields' below). Required.",
                    "columnLabels": "Optional array of strings, one per column, shown as headers above the diagram. columnLabels[0] labels the leftmost column, columnLabels[1] the next, and so on. Omit the array entirely, or use an empty string for any column you don't want labelled. Number of columns is determined automatically by the link structure (see 'how_columns_work')."
                },
                "node_fields": {
                    "name": "REQUIRED. String. The unique internal identifier for this node — links reference nodes by this exact string. Must be unique across all nodes. Can contain spaces, ampersands, etc. Convention for pass-through chains: suffix with @1, @2, @3... (see 'pass_through_nodes' below) — but this is just a naming convention for your own clarity, not a special syntax the tool parses structurally.",
                    "color": "REQUIRED. Object: { \"themeIndex\": 0-7, \"variant\": \"...\" }. themeIndex selects which of the 8 theme palette colors to use (0-indexed, so 8 valid values: 0,1,2,3,4,5,6,7). variant must be one of: 'base' (the theme color as-is), 'tint0' (10% lighter), 'tint1' (25% lighter), 'tint2' (40% lighter), 'tint3' (60% lighter), 'tint4' (80% lighter), 'shade0' (25% darker), 'shade1' (50% darker). This is a REFERENCE, not a literal hex color — if the user changes their theme palette later, every node using that themeIndex updates automatically. Do not put a hex string here.",
                    "value": "OPTIONAL. Positive number. Only needed if you want to force a node's displayed total to differ from what its links sum to (rare — normally omit this and let it compute automatically from inflow/outflow).",
                    "column": "OPTIONAL. Non-negative integer (0, 1, 2...). Pins a node to a specific column instead of letting the automatic layout decide. Use sparingly — only when the natural topology-derived column would be wrong for your intent. Most files should omit this entirely.",
                    "displayName": "OPTIONAL. String. The label actually shown on the diagram for this node, if different from 'name'. Use this when 'name' needs a technical/unique suffix (e.g. 'Aviva@1') but you want the diagram to just show 'Aviva'. Omit to display 'name' as-is. Set to an empty string \"\" to suppress the label entirely (rare)."
                },
                "link_fields": {
                    "source": "REQUIRED. String. Must exactly match a node's 'name'.",
                    "target": "REQUIRED. String. Must exactly match a node's 'name'. Must be in the same or a later column than source — links never point backwards.",
                    "value": "REQUIRED. Positive number. The flow magnitude — this is what determines the visual thickness of the ribbon and the size of the connected nodes. Use whatever unit makes sense for your data (£m, units, %, headcount, etc.) — the tool doesn't care about units, only relative magnitude."
                },
                "how_columns_work": "Columns are NOT something you assign per node in normal use. The tool walks the link graph: any node with no inbound links is column 0; every other node's column is (one more than the maximum column of anything that flows into it). So a simple A→B→C chain gives 3 columns automatically. If you want a node to skip a column or share a column with nodes it's not directly connected to at the same depth, use the optional node-level 'column' override — but most diagrams never need this.",
                "flow_conservation": "Not strictly enforced by the tool, but for a coherent diagram every internal node's total inflow should equal its total outflow (a node that isn't a pure source or pure sink). If a node has only inbound links it's a terminal/sink (right-hand side). If it has only outbound links it's a source (left-hand side). Mismatched in/out on a middle node will still render, but will look like flow is appearing or disappearing.",
                "pass_through_nodes": "If you want a node to be collapsible (foldable into its successor when the user clicks the diagram's 'Collapse' toggle), give it EXACTLY ONE outbound link, make the inflow exactly equal that one outbound link's value, and give it the same displayed name as its successor (either by literal 'name' match minus a suffix, or matching 'displayName' values). A common pattern: name the pre-state 'Provider@1' and the post-state 'Provider@2', both with displayName 'Provider' (or just rely on the tool's default behavior of stripping a trailing @N from the name for display). A node that splits into 2+ outbound links, or whose name doesn't match its successor's, will never collapse and will always render as its own column entry — this is useful for deliberately 'residual' nodes you always want visible.",
                "color_strategy": "If you omit thinking about color entirely and just supply nodes without pre-assigning deliberate colors, the tool's auto-color feature (triggered automatically as the diagram is built, or via the 'Auto-color' button) will assign colors itself: every source/sink-column node gets theme color 0, and every internal node gets a distinct color cycling through theme colors 1-7 then through progressively lighter/darker variants, in top-to-bottom order matching the diagram's vertical layout. You only need to hand-pick 'color' values for nodes where the auto-assigned color would be wrong for your purposes (e.g. a node that should visually match a brand color).",
                "minimal_example": {
                    "version": 2,
                    "nodes": [
                        { "name": "Total", "color": { "themeIndex": 0, "variant": "base" } },
                        { "name": "Category A", "color": { "themeIndex": 1, "variant": "base" } },
                        { "name": "Category B", "color": { "themeIndex": 2, "variant": "base" } },
                        { "name": "Outcome", "color": { "themeIndex": 0, "variant": "base" } }
                    ],
                    "links": [
                        { "source": "Total", "target": "Category A", "value": 60 },
                        { "source": "Total", "target": "Category B", "value": 40 },
                        { "source": "Category A", "target": "Outcome", "value": 60 },
                        { "source": "Category B", "target": "Outcome", "value": 40 }
                    ],
                    "columnLabels": ["Start", "Category", "End"]
                }
            };
        }

        function exportJSON() {
            const data = isV3Mode()
                ? { version: 3, columns: seriesColumns, series: seriesModel, flows: seriesFlows }
                : (() => {
                    // Export uses 'displayName' (the documented, import-side field name).
                    // Internally, the live nodes[] array uses '.label' (set by
                    // syncNodesFromRegistry from the nodeLabels map) — translate here so a
                    // round-tripped file (export, then re-import) actually preserves custom
                    // labels instead of silently losing them to a field-name mismatch.
                    const exportNodes = nodes.map(n => {
                        const out = { name: n.name, color: n.color };
                        if (typeof n.value === 'number') out.value = n.value;
                        if (typeof n.column === 'number') out.column = n.column;
                        if (n.label !== undefined) out.displayName = n.label; // "" preserved (suppress)
                        return out;
                    });
                    const d = { version: 2, nodes: exportNodes, links };
                    if (columnLabels.length) d.columnLabels = columnLabels;
                    d._instructions = buildExportInstructions();
                    return d;
                  })();
            const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url; a.download = `sankey_data_${new Date().toISOString().slice(0,10)}.json`;
            document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
        }

        function importJSON() { document.getElementById('json-file-input').click(); }

        // version 2 is a deliberate breaking change from version 1: node.color used to be a
        // literal hex string, and is now a {themeIndex, variant} reference into themePalette
        // (so editing a theme color flows through to every node that uses it — see the
        // Theme palette section above). A version-1 file's color values would silently
        // misinterpret as malformed reference objects if loaded as-is, so this is rejected
        // outright with a specific, actionable error rather than guessed at or
        // auto-migrated. Per explicit decision: old data files are simply incompatible: the
        // person re-exports from the old version's "Export data" (still on hex strings)
        // and rebuilds the file, or starts fresh.
        function applyImportedSankeyData(data) {
            if (data.version === 3) {
                if (!Array.isArray(data.series) || !Array.isArray(data.flows)) throw new Error("V3 file must have 'series' and 'flows' arrays.");
                const colorsOk = data.series.every(s => !s.color || (typeof s.color === 'object' && typeof s.color.themeIndex === 'number'));
                if (!colorsOk) throw new Error("Series color must be a theme reference {themeIndex, variant}.");
                seriesColumns = Array.isArray(data.columns) ? data.columns : [];
                seriesModel   = data.series;
                seriesFlows   = data.flows;
                nodes = []; links = []; columnLabels = [];
                paletteMode = 'branded';
                renderDataPanel(); saveToLocalStorage(); generateDiagram();
            } else if (data.version === 2) {
                if (!data.nodes || !data.links) throw new Error("Missing structural arrays");
                const colorRefShapeOk = data.nodes.every(n => !n.color || (typeof n.color === 'object' && typeof n.color.themeIndex === 'number'));
                if (!colorRefShapeOk) throw new Error("This data file's node colors aren't in the expected theme-reference format.");
                const overridesOk = data.nodes.every(n =>
                    (n.value === undefined || (typeof n.value === 'number' && n.value >= 0)) &&
                    (n.column === undefined || (typeof n.column === 'number' && Number.isInteger(n.column) && n.column >= 0)) &&
                    (n.displayName === undefined || typeof n.displayName === 'string')
                );
                if (!overridesOk) throw new Error("One or more nodes has an invalid 'value' or 'column' field.");
                seriesColumns = null; seriesModel = null; seriesFlows = null;
                nodeRegistry = {};
                nodeLabels = {};
                manualColorOverrides = {};
                data.nodes.forEach(n => {
                    nodeRegistry[n.name] = { color: n.color };
                    if (n.color) manualColorOverrides[n.name] = true;
                    if (n.displayName && n.displayName !== n.name) nodeLabels[n.name] = n.displayName;
                });
                links = data.links;
                nodes = data.nodes;
                columnLabels = Array.isArray(data.columnLabels) ? data.columnLabels : [];
                syncNodesFromRegistry();
                data.nodes.forEach(src => {
                    const dest = nodes.find(n => n.name === src.name);
                    if (!dest) return;
                    if (typeof src.value  === 'number') dest.value  = src.value;
                    if (typeof src.column === 'number') dest.column = src.column;
                });
                renderSmartTable(); saveToLocalStorage(); generateDiagram();
            } else {
                throw new Error("This data file is from an older, incompatible version. Please re-create it in the current version.");
            }
        }

        document.getElementById('json-file-input').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(ev) {
                try {
                    applyImportedSankeyData(JSON.parse(ev.target.result));
                } catch (err) { alert("Couldn't load this file: " + err.message); }
            };
            reader.readAsText(file); e.target.value = '';
        });

        // "Theme" file: just the 8 base palette colors (system default, or whatever the
        // person has customized via the gradient/RGB editor), independent of any node data.
        // This is what flows through to every node's color automatically when loaded —
        // node data files reference theme slots by index, not by literal color, so loading
        // a new theme re-colors the whole diagram without touching node/flow data at all.
        function exportTheme() {
            const blob = new Blob([JSON.stringify({ themeVersion: 1, themePalette }, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url; a.download = `sankey_theme.json`;
            document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
        }

        function importTheme() { document.getElementById('branding-file-input').click(); }

        document.getElementById('branding-file-input').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(ev) {
                try {
                    const data = JSON.parse(ev.target.result);
                    if (!Array.isArray(data.themePalette) || data.themePalette.length !== 8) {
                        throw new Error("Expected a theme file with 8 palette colors.");
                    }
                    const allValidHex = data.themePalette.every(c => /^#[0-9a-fA-F]{6}$/.test(c));
                    if (!allValidHex) throw new Error("Theme file contains an invalid color value.");
                    themePalette = data.themePalette;
                    saveToLocalStorage(); renderSmartTable(); generateDiagram(); syncSystemThemeSelect();
                } catch (err) { alert("Couldn't load this theme: " + err.message); }
            };
            reader.readAsText(file); e.target.value = '';
        });

        // Exports the live, fully-styled SVG exactly as rendered, with no background
        // fill — the diagram is transparent by default since we never paint one,
        // which keeps the file usable directly in decks, docs, or other designs.
        // Resolves the var(--sk-*) custom properties used on-screen into concrete values,
        // since a standalone SVG file opened outside this page has no access to the page's
        // :root declarations — without this, every accent/neutral color would render as
        // black (the SVG fallback for an unresolved var()).
        // Token table and resolver now live in sankey-render.js (shared with the CLI).
        function resolveTokens(str) { return SankeyRender.resolveTokens(str); }

        function getStyledSvgString() {
            const svgEl = chartDiv;
            if (!svgEl) return null;

            const clone = svgEl.cloneNode(true);
            clone.setAttribute('xmlns', 'http://www.w3.org/2000/svg');

            // Export is transparent-background by design (per requirement): the on-screen
            // warm canvas tone is a preview affordance, not part of the exported asset, so
            // the SVG drops cleanly onto decks, docs, or any other background downstream.
            const bgRect = clone.querySelector('rect.sk-canvas-bg');
            if (bgRect) bgRect.remove();

            // Resolve every var(--sk-*) reference left in fill/stroke attributes to its
            // concrete hex value (covers node/ribbon fills, which are set as element
            // attributes rather than through the stylesheet below).
            clone.querySelectorAll('[fill], [stroke]').forEach(el => {
                const fill = el.getAttribute('fill');
                const stroke = el.getAttribute('stroke');
                if (fill && fill.includes('var(')) el.setAttribute('fill', resolveTokens(fill));
                if (stroke && stroke.includes('var(')) el.setAttribute('stroke', resolveTokens(stroke));
            });

            // Inline the stylesheet rules our classes depend on, since a standalone SVG
            // file opened outside this page has no access to its <style> block.
            const styleEl = document.createElementNS('http://www.w3.org/2000/svg', 'style');
            styleEl.textContent = SankeyRender.EXPORT_STYLE_CSS;
            clone.insertBefore(styleEl, clone.firstChild);

            // Strip transient hover/interaction state — exports should always reflect
            // the diagram's resting state, not whatever was hovered at export time.
            clone.querySelectorAll('.is-dimmed').forEach(el => el.classList.remove('is-dimmed'));

            return new XMLSerializer().serializeToString(clone);
        }

        function exportSVG() {
            if (!chartDiv) return alert("Render diagram first.");
            const svgString = getStyledSvgString();
            if (!svgString) return alert("Could not read chart SVG.");
            const blob = new Blob([svgString], { type: 'image/svg+xml;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url; a.download = 'sankey_diagram.svg';
            document.body.appendChild(a); a.click(); document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        function resetAll() {
            if (!confirm("Reset chart workspace entirely?")) return;
            nodes = []; links = []; columnLabels = []; nodeRegistry = {}; nodeLabels = {};
            seriesColumns = null; seriesModel = null; seriesFlows = null;
            localStorage.removeItem('sankeyWorkspaceData_v15');
            renderSmartTable();
            document.getElementById('sankey-chart').innerHTML = '';
        }

        function loadDefaultExample() {
            // A deliberately richer demo than a plain 3-column flow — every feature the
            // tool supports has at least one node/link/setting here that exercises it, so
            // opening the app for the first time shows what "data in" can produce in
            // "diagram out", not just the simplest possible case:
            //
            //  • Pass-through collapse: "Direct Sales" appears as Direct Sales@1 → Direct
            //    Sales@2 with matching in/out value and identical display name — a true
            //    pass-through that the Collapse toggle will fold into a single node.
            //  • Residual (non-collapsing) node: "Partner Referrals" sits in the same
            //    column as the @1 pass-through node but splits its output two ways, so it
            //    can NEVER collapse — when Collapse is toggled this is the node that stays
            //    behind and inherits its correct vertical position from the full layout.
            //  • Custom label override: the "EMEA" node displays as "EMEA" but its
            //    internal/raw name has a longer canonical form, demonstrating displayName.
            //  • Manual color override: "Enterprise" is given an explicit theme color
            //    that auto-color won't touch, alongside every other node which IS
            //    auto-colored — shows the two systems coexisting.
            //  • Pinned column: "Support Contracts" is forced to column 2 via an explicit
            //    column override even though its natural topology rank would place it
            //    elsewhere, demonstrating manual column pinning.
            //  • Column labels: every column has a header, exercising that feature.
            //  • Long name: "Professional Services & Consulting" exercises label wrapping.
            //  • A very small value ("Other", 0.4) alongside large ones (Revenue, 410)
            //    exercises the min-node-height floor and confirms labels never disappear.
            seriesColumns = null; seriesModel = null; seriesFlows = null;
            columnLabels = ['Revenue Source', 'Channel', 'Region', 'Outcome'];
            paletteMode = 'branded';
            diagramAspect = '16:9';

            nodeRegistry = {
                'Revenue':                              { color: { themeIndex: 0, variant: 'base' } },
                'Direct Sales@1':                        { color: { themeIndex: 1, variant: 'base' } },
                'Partner Referrals':                     { color: { themeIndex: 2, variant: 'base' } },
                'Professional Services & Consulting':    { color: { themeIndex: 3, variant: 'base' } },
                'Direct Sales@2':                        { color: { themeIndex: 1, variant: 'base' } },
                'EMEA_Region_Code_4471':                 { color: { themeIndex: 4, variant: 'base' } }, // internal id; displayed as "EMEA"
                'Enterprise':                             { color: { themeIndex: 6, variant: 'tint3' } }, // manual override
                'Support Contracts':                     { color: { themeIndex: 5, variant: 'base' } },
                'Renewed Revenue':                       { color: { themeIndex: 7, variant: 'base' } },
                'Other':                                  { color: { themeIndex: 7, variant: 'shade0' } },
            };
            nodeLabels = {
                'EMEA_Region_Code_4471': 'EMEA', // demonstrates a REAL displayName override: technical internal name, clean displayed label
            };
            manualColorOverrides = { 'Enterprise': true };

            links = [
                // Revenue → channel (col 0 → col 1)
                { source: 'Revenue', target: 'Direct Sales@1', value: 280 },
                { source: 'Revenue', target: 'Partner Referrals', value: 90 },
                { source: 'Revenue', target: 'Professional Services & Consulting', value: 40 },

                // Direct Sales is a pure pass-through: 280 in, 280 out, same display name
                { source: 'Direct Sales@1', target: 'Direct Sales@2', value: 280 },

                // Partner Referrals splits — can never collapse
                { source: 'Partner Referrals', target: 'EMEA_Region_Code_4471', value: 55 },
                { source: 'Partner Referrals', target: 'Support Contracts', value: 35 },

                // Professional Services flows straight into Support Contracts (col 1 → col 2)
                { source: 'Professional Services & Consulting', target: 'Support Contracts', value: 40 },

                // col 2 → col 3 (region/category → outcome)
                { source: 'Direct Sales@2', target: 'Enterprise', value: 210 },
                { source: 'Direct Sales@2', target: 'Renewed Revenue', value: 69.6 },
                { source: 'Direct Sales@2', target: 'Other', value: 0.4 },
                { source: 'EMEA_Region_Code_4471', target: 'Renewed Revenue', value: 55 },
                { source: 'Support Contracts', target: 'Renewed Revenue', value: 75 },
            ];

            // Build nodes[] the same way the live app always does — from the registry,
            // links, and label map — rather than hand-duplicating that logic here, so the
            // demo data is guaranteed to be structured exactly like anything the app
            // produces through normal use.
            syncNodesFromRegistry();
            // Pin "Support Contracts" to column 2 explicitly (its natural rank from
            // Partner Referrals would already land it there, but this demonstrates the
            // override mechanism is wired through end-to-end).
            const supportNode = nodes.find(n => n.name === 'Support Contracts');
            if (supportNode) supportNode.column = 2;

            renderSmartTable();
            saveToLocalStorage();
            generateDiagram();
        }

        // Re-render on real size changes (orientation rotation, window resize, browser
        // chrome show/hide) rather than only on the next data edit. Without this, the
        // layout-tier CSS change above would only "work" the next time someone happened to
        // add or edit something — rotating the device wouldn't visibly do anything until
        // then, which defeats the purpose.
        //
        // This uses THREE overlapping signals rather than relying on any single one:
        // window 'resize', 'orientationchange', and ResizeObserver on the canvas shell.
        // This redundancy is deliberate, not accidental belt-and-suspenders: an earlier
        // version used ResizeObserver alone, verified working in desktop-Chromium viewport
        // resize tests, but confirmed NOT working on a real phone (diagram stayed exactly
        // the same width after a real rotation, even though the surrounding CSS grid did
        // correctly switch to its two-column layout). The grid reflowing but the SVG not
        // redrawing points at the resize signal itself failing to fire or firing with a
        // stale width on at least one real mobile browser engine — desktop-emulated
        // viewport resize in a testing tool is not proof a real device's rotation event
        // sequence behaves the same way. 'orientationchange' and 'resize' are the two most
        // universally-supported cross-browser signals for this and don't depend on
        // ResizeObserver semantics at all, so they're included even though ResizeObserver
        // alone "should" cover the same cases in theory.
        //
        // Debounce is longer (250ms, was 120ms) because real mobile browsers can report an
        // intermediate/incorrect viewport size for a brief moment immediately after
        // rotation, before settling on the final post-rotation layout — redrawing too early
        // risks measuring that transient incorrect width. The redraw also re-reads the
        // container's width fresh at fire time (inside generateDiagram() itself), not from
        // any cached value captured when the resize started.
        let resizeRedrawTimer = null;
        function scheduleResizeRedraw() {
            if (resizeRedrawTimer) clearTimeout(resizeRedrawTimer);
            resizeRedrawTimer = setTimeout(() => {
                resizeRedrawTimer = null;
                if (nodes.length && links.length) generateDiagram();
            }, 250);
        }

        function initResizeHandling() {
            window.addEventListener('resize', scheduleResizeRedraw);
            window.addEventListener('orientationchange', scheduleResizeRedraw);

            const shell = document.getElementById('sankey-canvas-shell');
            if (shell && typeof ResizeObserver !== 'undefined') {
                let lastWidth = shell.getBoundingClientRect().width;
                const observer = new ResizeObserver(entries => {
                    const newWidth = entries[0].contentRect.width;
                    // Only schedule on an actual width change, not every observer callback —
                    // generateDiagram() itself replaces the shell's children, which can fire
                    // a spurious observation; comparing widths avoids a feedback loop.
                    if (Math.abs(newWidth - lastWidth) > 1) {
                        lastWidth = newWidth;
                        scheduleResizeRedraw();
                    }
                });
                observer.observe(shell);
            }
        }

        window.buildExportInstructions = buildExportInstructions;
        window.applyImportedSankeyData = applyImportedSankeyData;

        window.onload = function() {
            loadFromLocalStorage();
            
            const slider = document.getElementById('global-opacity-slider');
            slider.value = Math.round(globalOpacityValue * 100);
            document.getElementById('opacity-slider-readout').innerText = slider.value + '%';
            document.getElementById('palette-restrained-btn').classList.toggle('is-active', paletteMode === 'restrained');
            document.getElementById('palette-branded-btn').classList.toggle('is-active', paletteMode === 'branded');
            document.getElementById('style-standard-btn').classList.toggle('is-active', ribbonStyle === 'standard');
            document.getElementById('style-classic-btn').classList.toggle('is-active', ribbonStyle === 'classic');
            document.getElementById('style-modern-btn').classList.toggle('is-active', ribbonStyle === 'modern');
            document.getElementById('show-values-btn').classList.toggle('is-active', showValues);
            document.getElementById('show-values-btn').textContent = showValues ? 'Values' : 'Names';
            document.getElementById('pass-through-btn').classList.toggle('is-active', showPassThrough);
            document.getElementById('pass-through-btn').textContent = showPassThrough ? 'Collapse' : 'Expand';
            document.querySelectorAll('.aspect-btn').forEach(b => {
                b.classList.toggle('is-active', b.dataset.aspect === diagramAspect);
            });
            applyLandscapeClass();
            syncSystemThemeSelect();
            
            if (links.length === 0 && !isV3Mode()) {
                loadDefaultExample();
                document.getElementById('palette-restrained-btn').classList.toggle('is-active', paletteMode === 'restrained');
                document.getElementById('palette-branded-btn').classList.toggle('is-active', paletteMode === 'branded');
            } else if (isV3Mode()) {
                renderDataPanel();
                generateDiagram();
            } else {
                renderSmartTable();
                generateDiagram();
            }

            initResizeHandling();
        };
    </script>
    <script src="ai-panel.js"></script>
</body>
</html>
